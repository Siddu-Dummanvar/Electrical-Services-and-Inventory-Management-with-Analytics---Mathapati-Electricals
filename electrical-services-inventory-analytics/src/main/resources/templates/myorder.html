<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>My Orders</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<style>
		body {
			background-color: #f8f9fa;
			padding: 20px;
		}

		.order-container {
			background: #fff;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		.table thead th {
			background-color: #343a40;
			color: white;
		}
	</style>
</head>

<body>
	<div class="container-fluid">
		<div class="order-container">
			<h2 class="text-center mb-4">My Order History</h2>

			<div th:if="${successMSG}" class="alert alert-success text-center" th:text="${successMSG}"></div>
			<div th:if="${errorMSG}" class="alert alert-danger text-center" th:text="${errorMSG}"></div>

			<div th:if="${myorders.empty}" class="alert alert-info text-center">
				You have not placed any orders yet. <a th:href="@{/index}">Start Shopping!</a>
			</div>

			<table th:if="${!myorders.empty}" class="table table-bordered table-striped">
				<thead>
					<tr>
						<th>Order Date</th>
						<th>Product</th>
						<th>Qty</th>
						<th>Total</th>
						<th>Payment</th>
						<th>Status</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="order : ${myorders}">
						<td th:text="${order.orderDate}"></td>
						<td th:text="${order.product?.name}"></td>
						<td th:text="${order.quantity}"></td>
						<td th:text="'₹' + ${order.price}"></td>
						<td th:text="${order.paymentType}"></td>
						<td>
							<span th:class="${order.status == 'Paid'} ? 'badge bg-success' : 'badge bg-warning'"
								th:text="${order.status}"></span>
							<br>
							<small th:if="${order.deliveryStatus}" class="text-muted"
								th:text="'Delivery: ' + ${order.deliveryStatus}"></small>
						</td>
						<td>
							<span th:text="${order.transactionId}"></span>

							<div class="mt-2" th:if="${order.status == 'Paid' && order.deliveryStatus == 'Delivered'}">

								<button th:if="${order.returnStatus == null}" type="button"
									class="btn btn-outline-danger btn-sm"
									th:onclick="'openReturnModal(' + ${order.id} + ')'">
									Return Item
								</button>

								<span th:if="${order.returnStatus != null}" class="badge bg-danger"
									th:text="${order.returnStatus}"></span>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
			<div class="text-center mt-4">
				<a th:href="@{/index}" class="btn btn-primary">Continue Shopping</a>
			</div>
		</div>
	</div>

	<div class="modal fade" id="returnModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">Return Product</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<form action="/user/return-request" method="post">
					<div class="modal-body">
						<input type="hidden" id="returnOrderId" name="orderId">
						<div class="mb-3">
							<label class="form-label fw-bold">Reason for Return:</label>
							<textarea name="reason" class="form-control" rows="3"
								placeholder="e.g. Defective, Wrong Item..." required></textarea>
						</div>
						<p class="text-muted small">*Returns accepted only within 2 days of delivery.</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="submit" class="btn btn-danger">Submit Request</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function openReturnModal(id) {
			document.getElementById('returnOrderId').value = id;
			new bootstrap.Modal(document.getElementById('returnModal')).show();
		}
	</script>
</body>

</html>
