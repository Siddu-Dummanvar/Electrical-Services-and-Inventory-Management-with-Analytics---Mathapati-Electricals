<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Information</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<style>
		/* Optional: Style for the big icon */
		.profile-icon {
			font-size: 10rem;
			/* Makes the icon very large */
			color: #6c757d;
			/* A neutral gray color */
		}
	</style>
</head>

<body>

	<div class="container mt-4">
		<div class="row">

			<div class="col-md-4 text-center d-flex flex-column align-items-center justify-content-center">

				<i class="bi bi-person-circle profile-icon"></i>

				<h3 th:text="${sessionUser.firstName} + ' ' + ${sessionUser.lastName}"></h3>

			</div>


			<div class="col-md-8">
				<h3>My Information</h3>

				<table class="table table-bordered table-striped">
					<tbody>
						<tr>
							<th>First Name</th>
							<td th:text="${sessionUser.firstName}"></td>
						</tr>
						<tr>
							<th>Last Name</th>
							<td th:text="${sessionUser.lastName}"></td>
						</tr>
						<tr>
							<th>Email</th>
							<td th:text="${sessionUser.emailid}"></td>
						</tr>

						<tr>
							<th>Phone Number</th>
							<td th:text="${sessionUser.phoneNo}"></td>
						</tr>
						<tr>
							<th>Address</th>
							<td
								th:text="${sessionUser.city} + ', ' + ${sessionUser.state} + ' - ' + ${sessionUser.pin}">
							</td>
						</tr>
						<tr>
							<th>Member Since</th>
							<td th:text="${sessionUser.registrationDate}"></td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
