<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Payment Receipt</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background-color: #f5f5f5;
			font-family: 'Courier New', Courier, monospace;
		}

		.receipt-box {
			max-width: 600px;
			margin: 50px auto;
			background: white;
			padding: 30px;
			border: 2px dashed #333;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
		}

		.header {
			text-align: center;
			border-bottom: 2px solid #ddd;
			padding-bottom: 15px;
			margin-bottom: 20px;
		}

		.invoice-details {
			display: flex;
			justify-content: space-between;
			margin-bottom: 20px;
		}

		.footer {
			text-align: center;
			margin-top: 40px;
			font-size: 0.9rem;
			color: #777;
		}

		.btn-print {
			margin-top: 20px;
			display: block;
			width: 100%;
		}

		@media print {
			.btn-print {
				display: none;
			}

			body {
				background-color: white;
			}

			.receipt-box {
				border: none;
				box-shadow: none;
				margin: 0;
				width: 100%;
			}
		}
	</style>
</head>

<body>

	<div class="receipt-box">
		<div class="header">
			<h3>MATHAPATI ELECTRICALS</h3>
			<p>Official Payment Receipt</p>
		</div>

		<div class="invoice-details">
			<div>
				<strong>Order ID:</strong> <span th:text="'ORD-' + ${order.id}"></span><br>
				<strong>Date:</strong> <span th:text="${order.orderDate}"></span>
			</div>
			<div class="text-end">
				<strong>Status:</strong> <span class="badge bg-success">PAID</span><br>
				<strong>Mode:</strong> <span th:text="${order.paymentType}">ONLINE</span>
			</div>
		</div>

		<table class="table table-bordered">
			<thead class="table-light">
				<tr>
					<th>Description</th>
					<th class="text-end">Qty</th>
					<th class="text-end">Amount</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>
						<span th:text="${order.product.name}">Product Name</span><br>
						<small class="text-muted" th:text="${order.transactionId}">Txn ID</small>
					</td>
					<td class="text-end" th:text="${order.quantity}">1</td>
					<td class="text-end" th:text="'₹' + ${order.price}">100.00</td>
				</tr>
				<tr>
					<td colspan="2" class="text-end fw-bold">Total Paid</td>
					<td class="text-end fw-bold bg-light" th:text="'₹' + ${order.price}">100.00</td>
				</tr>
			</tbody>
		</table>

		<div class="mb-4">
			<strong>Customer Details:</strong><br>
			<span th:text="${order.user.firstName + ' ' + order.user.lastName}">Name</span><br>
			<span th:text="${order.user.emailid}">Email</span>
		</div>

		<div class="footer">
			<p>Thank you for shopping with Mathapati Electricals!</p>
			<small>This is a computer-generated receipt.</small>
		</div>

		<button onclick="window.print()" class="btn btn-primary btn-print">Download / Print Receipt</button>
		<a href="/index" class="btn btn-outline-secondary btn-print mt-2">Back to Shop</a>
	</div>

	<script>
		// Automatically open print dialog when page loads
		window.onload = function () {
			setTimeout(function () {
				window.print();
			}, 1000);
		};
	</script>
</body>

</html>
