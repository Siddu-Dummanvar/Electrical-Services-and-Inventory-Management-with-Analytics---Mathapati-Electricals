<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>My Service Requests</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		body {
			background-color: #f8f9fa;
			padding: 20px;
		}

		.card {
			border: none;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
			border-radius: 12px;
		}

		.card-header {
			background-color: #fff;
			border-bottom: 2px solid #f0f0f0;
			padding: 20px;
			border-radius: 12px 12px 0 0 !important;
		}

		.table thead th {
			background-color: #f1f4f9;
			border: none;
			color: #555;
			font-weight: 600;
		}

		.badge-pending {
			background-color: #ffeeba;
			color: #856404;
		}

		.badge-assigned {
			background-color: #cce5ff;
			color: #004085;
		}

		.badge-completed {
			background-color: #d4edda;
			color: #155724;
		}

		.empty-state {
			text-align: center;
			padding: 50px;
			color: #777;
		}
	</style>
</head>

<body>

	<div class="container-fluid">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<h4 class="mb-0 fw-bold text-primary"><i class="bi bi-tools"></i> My Service Requests</h4>
				<a th:href="@{/services}" target="_parent" class="btn btn-sm btn-primary">+ Book New Service</a>
			</div>
			<div class="card-body p-0">

				<div th:if="${#lists.isEmpty(myServices)}" class="empty-state">
					<img src="https://cdn-icons-png.flaticon.com/512/7486/7486747.png" width="80" alt="No Services">
					<h5 class="mt-3">No Service Requests Found</h5>
					<p>You haven't booked any electrical services yet.</p>
				</div>

				<div class="table-responsive" th:unless="${#lists.isEmpty(myServices)}">
					<table class="table table-hover align-middle mb-0">
						<thead>
							<tr>
								<th>Service Type</th>
								<th>Preferred Date</th>
								<th>Cost</th>
								<th>Technician</th>
								<th>Status</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="service : ${myServices}">
								<td>
									<span class="fw-bold" th:text="${service.serviceType}">Service</span>
									<br><small class="text-muted"
										th:text="${'Booked on: ' + #temporals.format(service.createdOn, 'dd-MMM-yyyy')}"></small>
								</td>

								<td>
									<i class="bi bi-calendar-event"></i> <span
										th:text="${service.preferredDate}"></span>
									<br><small th:text="${service.preferredTime}"></small>
								</td>

								<td class="fw-bold text-success" th:text="${'₹' + service.amount}">₹0.0</td>

								<td>
									<span th:if="${service.assignedEmployee != null}"
										th:text="${service.assignedEmployee.firstName}">Technician</span>
									<span th:if="${service.assignedEmployee == null}" class="text-muted">-- Not Assigned
										--</span>
								</td>

								<td>
									<span th:if="${service.serviceStatus == 'New Request'}"
										class="badge badge-pending px-3 py-2 rounded-pill">Pending</span>
									<span th:if="${service.serviceStatus == 'Assigned'}"
										class="badge badge-assigned px-3 py-2 rounded-pill">In Progress</span>
									<span th:if="${service.serviceStatus == 'Completed'}"
										class="badge badge-completed px-3 py-2 rounded-pill">Completed</span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
