<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Error</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

	<div class="card shadow-lg text-center p-4" style="width: 400px;">
		<h2 class="text-danger">Oops!</h2>
		<p class="mt-3">Something went wrong. Please try again later.</p>
		<p th:if="${errorMSG}" class="mb-5">
			<span th:text="${errorMSG}"></span>
		</p>
		<a href="/LandingPage" class="btn btn-primary mt-3">Go Back Home</a>
	</div>

</body>

</html>
