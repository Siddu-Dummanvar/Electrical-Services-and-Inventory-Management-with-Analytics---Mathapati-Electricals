<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Footer Fragment</title>
    <!-- Bootstrap Icons (Ensure this is included in your main pages, but keeping it here for preview) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- 
      MAIN FOOTER FRAGMENT 
      Usage: <div th:replace="~{fragments/footer :: fullFooter}"></div>
    -->
    <footer th:fragment="fullFooter" style="background-color: #022860; color: white; padding: 40px 0; margin-top: 3rem;">
      <div class="container text-center">

        <!-- SECTION 1: ABOUT US -->
        <div class="mb-5">
            <h5 class="fw-bold mb-3" id="aboutus">About Us</h5>
            <p class="mb-4" style="max-width: 700px; margin: 0 auto; font-size: 16px; color: #dcdcdc;">
              <strong>Mathapati Electricals</strong> is a platform that simplifies electrical service management,
              inventory tracking, and analytics — helping businesses work smarter and more efficiently.
            </p>
        </div>

        <!-- SECTION 2: SOCIAL MEDIA -->		
        <div class="mb-4">
            <h5 class="fw-bold mb-4">Follow Us On</h5>
            
            <!-- Flex container to align icons horizontally with space between them -->
            <div class="d-flex justify-content-center gap-4 gap-md-5">
                
                <!-- Instagram Item --> 
                <a href="https://www.instagram.com/mathapatielectricals/" target="_blank" class="text-white text-decoration-none">
                    <div class="d-flex flex-column align-items-center">
                        <i class="bi bi-instagram mb-1" style="font-size: 28px;"></i>
                        <span style="font-size: 14px;">Instagram</span>
                    </div>
                </a>

                <!-- Facebook Item -->
                <a href="https://www.facebook.com" target="_blank" class="text-white text-decoration-none">
                    <div class="d-flex flex-column align-items-center">
                        <i class="bi bi-facebook mb-1" style="font-size: 28px;"></i>
                        <span style="font-size: 14px;">Facebook</span>
                    </div>
                </a>

                <!-- YouTube Item -->
                <a href="https://www.youtube.com/@siddu-sd5449" target="_blank" class="text-white text-decoration-none">
                    <div class="d-flex flex-column align-items-center">
                        <i class="bi bi-youtube mb-1" style="font-size: 28px;"></i>
                        <span style="font-size: 14px;">YouTube</span>
                    </div>
                </a>

            </div>
        </div>

        <!-- DIVIDER LINE -->
        <hr style="border-color: rgba(255,255,255,0.2); width: 60%; margin: 30px auto;">

        <!-- COPYRIGHT SECTION -->
        <p class="mb-0" style="font-size: 15px;">
          &copy; <span th:text="${#temporals.format(#temporals.createNow(),'yyyy')}">2025</span> 
          <strong>Mathapati Electricals</strong>. All Rights Reserved.
        </p>
      </div>
    </footer>

</body>
</html>
