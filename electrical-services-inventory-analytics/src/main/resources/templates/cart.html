<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>My Shopping Cart</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<style>
		body {
			background-color: #f8f9fa;
			padding: 20px;
		}

		.cart-container {
			background: #fff;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		.total-section {
			font-size: 1.2rem;
			font-weight: bold;
			background-color: #f8f9fa;
		}
	</style>
</head>

<body>

	<div class="container-fluid">
		<div class="cart-container">
			<h3 class="mb-4 text-primary"><i class="bi bi-cart-fill"></i> My Cart Items</h3>

			<div class="text-center p-5" th:if="${cartItems.isEmpty()}">
				<h4 class="text-muted">Your cart is empty!</h4>
				<p>Looks like you haven't added any electrical items yet.</p>
				<a href="/index" target="_top" class="btn btn-primary mt-3">Start Shopping</a>
			</div>

			<div class="table-responsive" th:unless="${cartItems.isEmpty()}">
				<table class="table table-bordered table-hover table-striped text-center mb-0">
					<thead class="table-dark">
						<tr>
							<th>S.No</th>
							<th>Product Name</th>
							<th>Price</th>
							<th>Quantity</th>
							<th>Total Price</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c, iterStat : ${cartItems}">
							<td th:text="${iterStat.count}">1</td>
							<td class="fw-bold" th:text="${c.product.name}">Wire Bundle</td>
							<td th:text="'₹' + ${c.product.sellingPrice}">₹500.0</td>
							<td>
								<span class="badge bg-secondary" th:text="${c.quantity}">1</span>
							</td>
							<td class="text-success fw-bold" th:text="'₹' + ${c.product.sellingPrice * c.quantity}">
								₹500.0</td>
							<td>
								<a th:href="@{'/cart/remove/' + ${c.id}}" class="btn btn-danger btn-sm"
									onclick="return confirm('Are you sure you want to remove this item?')">
									Remove
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="card-footer total-section d-flex justify-content-between align-items-center mt-3 p-3 border"
				th:unless="${cartItems.isEmpty()}">
				<span>Total Amount:</span>
				<span class="text-primary" th:text="'₹' + ${totalOrderPrice}">₹0.0</span>
			</div>

			<div class="card p-3 my-3" th:unless="${cartItems.isEmpty()}">
				<h5>Select Payment Method</h5>
				<div class="form-check">
					<input class="form-check-input" type="radio" name="paymentMode" id="modeCOD" value="COD">
					<label class="form-check-label" for="modeCOD">
						Cash on Delivery (Pay when it arrives)
					</label>
				</div>
				<div class="form-check">
					<input class="form-check-input" type="radio" name="paymentMode" id="modeONLINE" value="ONLINE"
						checked>
					<label class="form-check-label" for="modeONLINE">
						Online Payment (Razorpay)
					</label>
				</div>
			</div>

			<button th:unless="${cartItems.isEmpty()}" onclick="processPayment()" class="btn btn-primary btn-lg w-100">
				Place Order
			</button>
		</div>
		<div class="text-center mt-4">
			<a th:href="@{/index}" target="_top" class="btn btn-primary">Continue Shopping</a>
		</div>
	</div>

	<script th:inline="javascript">

		// 1. Main Function
		const processPayment = () => {
			let amount = /*[[${totalOrderPrice}]]*/ 0;
			let paymentMode = $('input[name="paymentMode"]:checked').val();

			if (amount == 0) {
				alert("Cart is empty!");
				return;
			}

			if (paymentMode === 'COD') {
				placeOrderOnServer("COD", "Pending");
			} else {
				startRazorpayPayment(amount);
			}
		};

		// 2. Razorpay Function
		const startRazorpayPayment = (amount) => {
			$.ajax({
				url: '/create_order',
				data: JSON.stringify({amount: amount, info: 'order_request'}),
				contentType: 'application/json',
				type: 'POST',
				dataType: 'json',
				success: function (response) {
					if (response.status == "created") {
						let options = {
							key: 'rzp_test_RnwFYefaZom83T', // YOUR KEY
							amount: response.amount,
							currency: 'INR',
							name: 'Mathapati Electricals',
							description: 'Checkout',
							order_id: response.id,
							handler: function (paymentResponse) {
								placeOrderOnServer("ONLINE", "Paid", paymentResponse.razorpay_payment_id);
							},
							theme: {color: "#3399cc"}
						};
						let rzp = new Razorpay(options);
						rzp.on('payment.failed', function (response) {
							alert("Payment Failed: " + response.error.description);
						});
						rzp.open();
					}
				},
				error: function (error) {
					console.log(error);
					alert("Error starting payment. Check console.");
				}
			});
		};


		// 3. Save Order Function
		// 3. Save Order Function (UPDATED FOR BULK)
		const placeOrderOnServer = (mode, status, txnId = "NA") => {

			// If COD, generate a random Transaction ID for grouping
			if (txnId === "NA") {
				txnId = "COD-" + Math.floor(Math.random() * 1000000);
			}

			$.ajax({
				url: '/save_bulk_order',  // ✅ Pointing to the NEW bulk controller
				type: 'POST',
				contentType: 'application/json',
				data: JSON.stringify({
					paymentMode: mode,
					paymentStatus: status,
					transactionId: txnId,
					amount: /*[[${totalOrderPrice}]]*/ 0
				}),
				success: function (response) {
					if (response.status === "success") {
						// 🚀 REDIRECT TO BULK SUCCESS PAGE
						window.location.href = "/order-confirmation/txn/" + response.transactionId;
					} else {
						alert("Cart is empty or error occurred.");
					}
				},
				error: function (error) {
					alert("Failed to save order. Check console.");
					console.log(error);
				}
			});
		}
	</script>
</body>

</html>
