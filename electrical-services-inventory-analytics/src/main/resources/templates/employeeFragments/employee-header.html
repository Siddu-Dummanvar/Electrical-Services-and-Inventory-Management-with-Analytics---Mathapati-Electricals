<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="employeeHeader">
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(90deg, #022860, #3f97db); padding: 0;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img th:src="@{/images/tiger.jpg}" class="me-2 rounded-circle" alt="Logo" width="40" height="40" style="border: 2px solid white;">
                    <span class="fw-bold">Employee Portal</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#empNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="empNavbar">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item me-3 text-white">
                            <span class="d-none d-md-inline">Hello, </span>
                            <span class="fw-bold" th:text="${employee.firstName}">User</span>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/employee/logout}" class="btn btn-sm btn-light text-primary fw-bold">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

</body>
</html>
