<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
	<div class="sidebar bg-dark text-white p-3" th:fragment="employeeSidebar" style="min-height: 100vh;">

		<div class="text-center mb-4 mt-3">
			<div class="mb-2">
				<i class="bi bi-person-circle display-4 text-secondary"></i>
			</div>

			<h5 class="mb-1 fw-bold" th:text="${employee.firstName} + ' ' + ${employee.lastName}"></h5>

			<span class="badge bg-secondary rounded-pill px-3 py-2 mt-1">
				<span th:if="${#strings.equalsIgnoreCase(employee.jobTitle, 'Delivery Boy')}">🚚 Delivery Boy</span>

				<span th:if="${!#strings.equalsIgnoreCase(employee.jobTitle, 'Delivery Boy')}">🔧 Technician</span>
			</span>
		</div>

		<hr class="text-secondary">

		<ul class="nav flex-column gap-2">
			<li class="nav-item">
				<a th:href="@{/employee/pending-work}" class="nav-link text-white navlink rounded">
					<i class="bi bi-hourglass-split me-2"></i> Pending Work
				</a>
			</li>

			<li class="nav-item">
				<a th:href="@{/employee/work-done}" class="nav-link text-white navlink rounded">
					<i class="bi bi-check2-circle me-2"></i> Work Done
				</a>
			</li>

			<li class="nav-item mt-4">
				<a th:href="@{/employee/logout}" class="nav-link text-danger navlink rounded">
					<i class="bi bi-box-arrow-left me-2"></i> Logout
				</a>
			</li>
		</ul>
	</div>
</body>

</html>
