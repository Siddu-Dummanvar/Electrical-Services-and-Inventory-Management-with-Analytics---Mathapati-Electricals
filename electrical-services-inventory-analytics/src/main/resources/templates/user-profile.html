<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Profile</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<style>
		/* FIX 1: Allow scrolling so the footer is visible */
		body,
		html {
			height: 100%;
			margin: 0;
			overflow-x: hidden;
			/* Only hide horizontal scroll */
		}

		.main-container {
			display: flex;
			/* Changed to min-height so it pushes the footer down but allows scrolling */
			min-height: calc(100vh - 56px);
		}
	</style>
</head>

<body>

	<div th:replace="~{userfragments/userheader :: header}"></div>
	</br>
	<div class="main-container">

		<div th:replace="~{userfragments/sidebar :: sidebar}"></div>

		<div style="flex-grow: 1; background-color: #f8f9fa;">
			<iframe name="contentFrame" src="" style="width: 100%; height: 100%; min-height: 600px; border: none;">
			</iframe>
		</div>
	</div>

	<div th:replace="~{fragments/footer-page :: fullFooter}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
