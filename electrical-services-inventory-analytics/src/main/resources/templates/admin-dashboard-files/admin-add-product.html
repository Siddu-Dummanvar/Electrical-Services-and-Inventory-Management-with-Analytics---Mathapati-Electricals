<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Add Product | Admin Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<style>
		.navbar {
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}

				.sidebar {
					height: 90vh;
					width: 260px;
					background-color: #071b38;
					margin-top: 10px;
				}

				.fontStyle {
					color: #f6eeee;
					text-decoration: none;
					font-size: large;
				}

				.navlink {
					padding: 10px 20px;
				}

				.navlink:hover {
					background-color: #072f4e;
				}
	</style>
</head>

<body>
	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
	<div class="container-fluid d-flex p-0">
		<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

		<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">
			<div class="container">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h2>Add New Product</h2>
					<a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
				</div>

				<div th:if="${successMSG}" class="alert alert-success">
					<i class="bi bi-check-circle-fill me-2"></i><strong th:text="${successMSG}"></strong>
				</div>

				<form th:action="@{/admin/products/add}" th:object="${newProduct}" method="POST"
					enctype="multipart/form-data" class="card p-4 shadow-sm">
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">Product Name</label>
							<input type="text" class="form-control" th:field="*{name}" required>
						</div>
						<div class="col-md-6">
							<label for="category" class="form-label">Category</label>
							<div class="input-group mb-2">
								<select class="form-select" id="category" th:field="*{category.id}" required>
									<option value="">-- Select Category --</option>
									<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
									</option>
								</select>
								<button class="btn btn-outline-primary" type="button" data-bs-toggle="collapse"
									data-bs-target="#quickAddCat">
									<i class="bi bi-plus-lg"></i> Add New
								</button>
							</div>
							<div class="collapse mb-3" id="quickAddCat">
								<div class="card card-body bg-light border-primary">
									<h6>Create New Category</h6>
									<div class="mb-2">
										<label class="small">Category Name</label>
										<input type="text" id="newCatName" class="form-control mb-2"
											placeholder="e.g. Solar">
										<label class="small">Category Image</label>
										<input type="file" id="newCatImage" class="form-control mb-2" accept="image/*">
										<button type="button" class="btn btn-success w-100"
											onclick="submitQuickCategory()">Save Category</button>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">Marked Price (MRP)</label>
							<div class="input-group">
								<span class="input-group-text">₹</span>
								<input type="number" step="0.01" class="form-control" th:field="*{markedPrice}"
									required>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Selling Price</label>
							<div class="input-group">
								<span class="input-group-text">₹</span>
								<input type="number" step="0.01" class="form-control" th:field="*{sellingPrice}"
									required>
							</div>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-4">
							<label class="form-label text-danger">Buying Price (Unit Cost)</label>
							<div class="input-group">
								<span class="input-group-text">₹</span>
								<input type="number" step="0.01" class="form-control" th:field="*{costPrice}" required>
							</div>
							<div class="form-text">Cost to buy one item (Used for Expenses).</div>
						</div>

						<div class="col-md-4">
							<label class="form-label">Stock Quantity</label>
							<input type="number" class="form-control" th:field="*{stock}" required>
						</div>

						<div class="col-md-4">
							<label class="form-label">Product Image</label>
							<input type="file" class="form-control" name="imageFile" accept="image/*" required>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Description</label>
						<textarea class="form-control" rows="3" th:field="*{description}" required></textarea>
					</div>

					<div class="text-end">
						<button type="submit" class="btn btn-primary btn-lg">Save Product</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		function submitQuickCategory() {
			const nameInput = document.getElementById('newCatName');
			const imageInput = document.getElementById('newCatImage');

			const name = nameInput.value;
			const imageFile = imageInput.files[0];

			if (!name || !imageFile) {alert("Please provide both a category name and an image."); return;}

			const formData = new FormData();
			formData.append('catName', name);
			formData.append('catImage', imageFile);

			fetch('/admin/categories/add-quick', {
				method: 'POST',
				body: formData
			})
				.then(response => {
					if (response.ok) {
						window.location.reload();
					} else {
						alert("Error saving category.");
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert("Connection error.");
				});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
