<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Management | Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/styles.css}">
	<link rel="stylesheet" th:href="@{/css/products.css}">

	<style>
		.navbar {
			padding-top: 0px;
			padding-bottom: 0px;
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}

		.navbar-brand img {
			border: 2px solid white;
		}

		.sidebar {
			height: 90vh;
			width: 250px;
			background-color: #071b38;
			margin-top: 10px;
		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-style: normal;
			font-size: large;
		}

		.navlink {
			padding-top: 10px;
			padding-bottom: 15px;
			padding-left: 20px;
		}

		.navlink:hover {
			background-color: #072f4e
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<section>
		<div class="container-fluid d-flex p-0">

			<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

			<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">
				<div class="container">
					<h2>Customer Feedback</h2>

					<div th:if="${feedbacks.isEmpty()}" class="alert alert-info">No feedback yet.</div>

					<div class="table-responsive" th:if="${!feedbacks.isEmpty()}">
						<table class="table table-striped table-hover align-middle">
							<thead class="table-dark">
								<tr>
									<th>Date</th>
									<th>Customer</th>
									<th>Phone</th>
									<th>Rating</th>
									<th>Message</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="f : ${feedbacks}">
									<td th:text="${#temporals.format(f.date, 'dd-MMM-yyyy')}"></td>
									<td th:text="${f.user.firstName + ' ' + f.user.lastName}"></td>
									<td th:text="${f.user.phoneNo}"></td>
									<td><span class="badge bg-warning text-dark"
											th:text="${f.rating} + ' Stars'"></span></td>
									<td th:text="${f.message}"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
