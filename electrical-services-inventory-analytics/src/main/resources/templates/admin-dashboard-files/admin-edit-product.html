<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit Product | Admin Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/styles.css}">
	<link rel="stylesheet" th:href="@{/css/products.css}">

	<style>
		.navbar {
			padding-top: 0px;
			padding-bottom: 0px;
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}

		.navbar-brand img {
			border: 2px solid white;
		}

		.sidebar {
			height: 90vh;
			width: 260px;
			background-color: #071b38;
			margin-top: 10px;
		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-size: large;
		}

		.navlink {
			padding: 10px 20px;
		}

		.navlink:hover {
			background-color: #072f4e;
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<section>
		<div class="container-fluid d-flex p-0">

			<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

			<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">

				<div class="container">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h2>Edit Product</h2>
						<a th:href="@{/admin/dashboard}" class="btn btn-secondary">
							<i class="bi bi-arrow-left-circle-fill me-2"></i>Back to Dashboard
						</a>
					</div>

					<form th:action="@{/admin/products/update}" th:object="${product}" method="POST"
						class="card p-4 shadow-sm">

						<input type="hidden" th:field="*{id}">

						<div class="row mb-3">
							<div class="col-md-6">
								<label for="productName" class="form-label">Product Name</label>
								<input type="text" class="form-control" id="productName" th:field="*{name}" required>
							</div>
							<div class="col-md-6">
								<label for="category" class="form-label">Category</label>
								<select class="form-select" id="category" th:field="*{category.id}" required>
									<option value="">-- Select a Category --</option>
									<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
										th:selected="${cat.id == product.category.id}">
										Fan
									</option>
								</select>
							</div>
						</div>

						<div class="row mb-3">
							<div class="col-md-6">
								<label for="markedPrice" class="form-label">Marked Price</label>
								<div class="input-group">
									<span class="input-group-text">₹</span>
									<input type="number" step="0.01" class="form-control" id="markedPrice"
										th:field="*{markedPrice}" required>
								</div>
							</div>
							<div class="col-md-6">
								<label for="sellingPrice" class="form-label">Selling Price</label>
								<div class="input-group">
									<span class="input-group-text">₹</span>
									<input type="number" step="0.01" class="form-control" id="sellingPrice"
										th:field="*{sellingPrice}" required>
								</div>
							</div>
						</div>

						<div class="row mb-3">
							<div class="col-md-6">
								<label for="stock" class="form-label">Stock Quantity</label>
								<input type="number" class="form-control" id="stock" th:field="*{stock}" required>
							</div>
							<div class="col-md-6">
								<label for="imageName" class="form-label">Image Filename</label>
								<input type="text" class="form-control" id="imageName" th:field="*{imageName}" required>
							</div>
						</div>

						<div class="mb-3">
							<label for="description" class="form-label">Product Description</label>
							<textarea class="form-control" id="description" rows="3" th:field="*{description}"
								required></textarea>
						</div>

						<div class="text-end">
							<button type="submit" class="btn btn-success btn-lg">
								<i class="bi bi-check-circle-fill me-2"></i>Update Product
							</button>
						</div>

					</form>

				</div>
			</div>
		</div>
	</section>

	<footer class="text-center py-4 bg-light mt-auto">
		<small>&copy; 2025 E S & Inventory Analytics</small>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
