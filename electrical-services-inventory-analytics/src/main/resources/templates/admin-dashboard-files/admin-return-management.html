<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Return Management | Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<style>
		.sidebar {
			height: 90vh;
			width: 260px;
			background-color: #071b38;
			margin-top: 10px;
		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-size: large;
		}

		.navlink {
			padding: 10px 20px;
		}

		.navlink:hover {
			background-color: #072f4e;
		}



		.navlink:hover {
			background-color: #072f4e;
		}

		.navbar {
			padding-top: 0px;
			padding-bottom: 0px;
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}

		.navlink {
			padding-top: 10px;
			padding-bottom: 15px;
			padding-left: 20px;

		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
	<div class="container-fluid d-flex p-0">
		<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

		<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">
			<h2 class="mb-4 text-danger"><i class="bi bi-arrow-counterclockwise"></i> Return Requests</h2>
			<div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

			<div class="card shadow-sm">
				<div class="card-body">
					<table class="table table-hover align-middle">
						<thead class="table-dark">
							<tr>
								<th>Order ID</th>
								<th>Product</th>
								<th>Customer</th>
								<th>Reason</th>
								<th>Delivery Boy</th>
								<th>Status</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="order : ${returns}">
								<td th:text="'#' + ${order.id}"></td>
								<td th:text="${order.product.name}"></td>
								<td>
									<div th:text="${order.user.firstName}"></div>
									<small class="text-muted" th:text="${order.user.phoneNo}"></small>
								</td>
								<td th:text="${order.returnReason}" class="text-danger fw-bold"></td>
								<td>
									<form th:if="${order.returnStatus == 'Requested'}"
										th:action="@{/admin/returns/assign}" method="post" class="d-flex gap-2">
										<input type="hidden" name="orderId" th:value="${order.id}">
										<select name="employeeEmail" class="form-select form-select-sm" required>
											<option value="">Select Boy</option>
											<option th:each="emp : ${deliveryBoys}" th:if="${emp.workStatus == 'FREE'}"
												th:value="${emp.email}" th:text="${emp.firstName}"></option>
										</select>
										<button type="submit" class="btn btn-sm btn-primary">Assign</button>
									</form>
									<span th:if="${order.returnStatus != 'Requested'}"
										th:text="${order.deliveryBoy != null ? order.deliveryBoy.firstName : 'Not Assigned'}"></span>
								</td>
								<td><span class="badge bg-info text-dark" th:text="${order.returnStatus}"></span></td>
							</tr>
							<tr th:if="${returns.empty}">
								<td colspan="6" class="text-center text-muted">No return requests.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
