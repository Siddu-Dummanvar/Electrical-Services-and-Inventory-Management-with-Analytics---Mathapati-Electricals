<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customer Analytics | Admin Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/styles.css}">

	<style>
		.sidebar {
			height: 100vh;
			width: 250px;
			background-color: #071b38;
			position: fixed;
		}

		.main-content {
			margin-left: 250px;
			padding: 20px;
			background-color: #f4f6f9;
			min-height: 100vh;
		}

		.revenue-text {
			color: #198754;
			font-weight: bold;
		}

		.total-badge {
			background-color: #0d6efd;
			color: white;
			padding: 5px 10px;
			border-radius: 20px;
		}

		.sidebar {
			height: 90vh;
			width: 250px;
			background-color: #071b38;
			margin-top: 10px;

		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-style: normal;
			font-size: large;
		}

		.navlink {
			padding-top: 10px;
			padding-bottom: 15px;
			padding-left: 20px;

		}

		.navlink:hover {
			background-color: #072f4e
		}

		.navbar {
			padding-top: 0px;
			padding-bottom: 0px;
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<div class="container-fluid p-0">

		<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

		<div class="main-content">

			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<h3 class="fw-bold text-dark mb-0">Customer Sales & Services</h3>
					<p class="text-muted">Track revenue generated by each customer</p>
				</div>
				<a th:href="@{/admin/dashboard}" class="btn btn-secondary">
					<i class="bi bi-arrow-left"></i> Dashboard
				</a>
			</div>

			<div class="card shadow-sm border-0 rounded-4">
				<div class="card-body p-0">
					<div class="table-responsive">
						<table class="table table-hover align-middle mb-0">
							<thead class="table-dark">
								<tr>
									<th>Customer Details</th>
									<th>Product Orders</th>
									<th>Service Requests</th>
									<th>Product Revenue</th>
									<th>Service Revenue</th>
									<th class="text-center">Total Amount</th>
									<th>Action</th>
								</tr>
							</thead>
							<tbody>
								<tr th:if="${customers.isEmpty()}">
									<td colspan="7" class="text-center py-4 text-muted">No customers found.</td>
								</tr>

								<tr th:each="stat : ${customers}">

									<td>
										<div class="d-flex flex-column">
											<span class="fw-bold"
												th:text="${stat.user.firstName + ' ' + stat.user.lastName}">Name</span>
											<small class="text-muted"
												th:text="${stat.user.emailid}">email@example.com</small>
											<small class="text-muted" th:text="${stat.user.phoneNo}">9876543210</small>
										</div>
									</td>

									<td>
										<span class="badge bg-secondary rounded-pill"
											th:text="${stat.productCount}">0</span> Orders
									</td>

									<td>
										<span class="badge bg-info text-dark rounded-pill"
											th:text="${stat.serviceCount}">0</span> Requests
									</td>

									<td class="text-success">
										+ <span
											th:text="'₹' + ${#numbers.formatDecimal(stat.productRevenue, 1, 0)}">₹0</span>
									</td>

									<td class="text-primary">
										+ <span
											th:text="'₹' + ${#numbers.formatDecimal(stat.serviceRevenue, 1, 0)}">₹0</span>
									</td>

									<td class="text-center">
										<h5 class="mb-0 fw-bold text-dark"
											th:text="'₹' + ${#numbers.formatDecimal(stat.grandTotal, 1, 0)}">₹0</h5>
									</td>

									<td>
										<a th:href="@{/admin/customers/view/{email}(email=${stat.user.emailid})}"
											class="btn btn-sm btn-primary text-nowrap">
											<i class="bi bi-eye-fill me-1"></i> History
										</a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
