<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Order Management | Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<style>
		.navbar {
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 0px;
		}

		.sidebar {
			height: 90vh;
			width: 260px;
			background-color: #071b38;
			margin-top: 10px;
		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-size: large;
		}

		.navlink {
			padding-top: 10px;
			padding-bottom: 15px;
			padding-left: 20px;

		}

		.navlink:hover {
			background-color: #072f4e;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
	<div class="container-fluid d-flex p-0">
		<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

		<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">
			<h2 class="mb-4 text-primary"><i class="bi bi-box-seam"></i> Order Management</h2>
			<div class="card shadow-sm">
				<div class="card-body">
					<table class="table table-hover align-middle">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Date</th>
								<th>Customer</th>
								<th>Product</th>
								<th>Total</th>
								<th>Status</th>
								<th>Delivery Boy</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="order : ${orders}">
								<td th:text="'#' + ${order.id}"></td>
								<td th:text="${order.orderDate}"></td>
								<td th:text="${order.user.firstName}"></td>
								<td th:text="${order.product.name}"></td>
								<td th:text="'₹' + ${order.price}"></td>
								<td th:text="${order.status}"></td>
								<td>
									<form th:if="${order.deliveryStatus == 'Pending'}"
										th:action="@{/admin/orders/assign}" method="post" class="d-flex gap-2">
										<input type="hidden" name="orderId" th:value="${order.id}">
										<select name="employeeEmail" class="form-select form-select-sm" required>
											<option value="">Select Boy</option>
											<option th:each="emp : ${employees}"
												th:if="${emp.jobTitle == 'Delivery Boy' && emp.workStatus == 'FREE'}"
												th:value="${emp.email}" th:text="${emp.firstName}"></option>
										</select>
										<button type="submit" class="btn btn-sm btn-primary">Assign</button>
									</form>
									<span th:if="${order.deliveryStatus != 'Pending'}"
										th:text="${order.deliveryStatus}"></span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
