<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Employee Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<style>
		body {
			background-color: #f4f6f9;
			overflow-x: hidden;
		}

		.sidebar {
			height: 100vh;
			width: 100%;
		}

		.status-card {
			border-left: 5px solid;
		}

		.card-free {
			border-color: #198754;
		}

		.card-busy {
			border-color: #dc3545;
		}

		.navlink:hover {
			background-color: #072f4e;
			border-left: 4px solid #3f97db;
		}
	</style>
</head>

<body>
	<div th:replace="~{employeeFragments/employee-header :: employeeHeader}"></div>
	<div class="container-fluid">
		<div class="row">
			<div class="col-md-2 p-0">
				<div th:replace="~{employeeFragments/employee-sidebar :: employeeSidebar}"></div>
			</div>
			<div class="col-md-10 p-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h3 class="fw-bold text-dark">My Dashboard</h3>
					<div class="card shadow-sm status-card"
						th:classappend="${employee.workStatus == 'FREE' ? 'card-free' : 'card-busy'}">
						<div class="card-body py-2 px-4">
							<span class="text-muted small">Status</span><br>
							<strong th:class="${employee.workStatus == 'FREE' ? 'text-success' : 'text-danger'}"
								th:text="${employee.workStatus}">FREE</strong>
						</div>
					</div>
				</div>

				<div th:if="${role == 'TECHNICIAN'}">
					<div class="card shadow border-0">
						<div class="card-header bg-primary text-white">
							<h5 class="mb-0">Assigned Services</h5>
						</div>
						<div class="card-body p-0">
							<table class="table table-hover mb-0 align-middle">
								<thead class="table-light">
									<tr>
										<th>Service ID</th>
										<th>Customer</th>
										<th>Type</th>
										<th>Status</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="task : ${myTasks}">
										<td th:text="'REQ-' + ${task.id}"></td>
										<td th:text="${task.fullName}"></td>
										<td th:text="${task.serviceType}"></td>
										<td th:text="${task.serviceStatus}"></td>
										<td>
											<span
												th:if="${task.serviceStatus == 'Assigned' or task.serviceStatus == 'Work Not Started'}"
												class="badge bg-warning text-dark mb-1">
												Work Pending
											</span>

											<form
												th:if="${task.serviceStatus == 'Assigned' or task.serviceStatus == 'Work Not Started'}"
												action="/employee/updateServiceStatus" method="post" class="mt-1">
												<input type="hidden" name="requestId" th:value="${task.id}">
												<input type="hidden" name="status" value="Under Progress">
												<button class="btn btn-sm btn-primary">Start Work</button>
											</form>

											<span th:if="${task.serviceStatus == 'Under Progress'}"
												class="badge bg-info text-dark mb-1">
												Working
											</span>

											<form th:if="${task.serviceStatus == 'Under Progress'}"
												action="/employee/updateServiceStatus" method="post" class="mt-1">
												<input type="hidden" name="requestId" th:value="${task.id}">
												<input type="hidden" name="status" value="Completed">
												<button class="btn btn-sm btn-success">Mark Completed</button>
											</form>

											<span th:if="${task.serviceStatus == 'Completed'}" class="badge bg-success">
												Work Done
											</span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>

				<div th:if="${role == 'DELIVERY'}">
					<div class="card shadow border-0 mb-4">
						<div class="card-header bg-primary text-white py-3">
							<h5 class="mb-0"><i class="bi bi-truck"></i> Pending Deliveries</h5>
						</div>
						<div class="card-body p-0">
							<table class="table table-hover align-middle mb-0">
								<thead class="table-light">
									<tr>
										<th>Order ID</th>
										<th>Customer</th>
										<th>Amount</th>
										<th>Status</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="order : ${myDeliveries}">
										<td th:text="'ORD-' + ${order.id}"></td>
										<td th:text="${order.user.firstName}"></td>
										<td th:text="'₹' + ${order.price}"></td>
										<td th:text="${order.deliveryStatus}"></td>
										<td>
											<form th:if="${order.deliveryStatus != 'Delivered'}"
												action="/employee/updateDeliveryStatus" method="post">
												<input type="hidden" name="orderId" th:value="${order.id}">
												<input type="hidden" name="status" value="Delivered">
												<button class="btn btn-dark btn-sm">Mark Delivered</button>
											</form>
										</td>
									</tr>
									<tr th:if="${myDeliveries.empty}">
										<td colspan="5" class="text-center">No pending deliveries.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>

					<div class="card shadow border-0">
						<div class="card-header bg-danger text-white py-3">
							<h5 class="mb-0"><i class="bi bi-arrow-counterclockwise"></i> Return Pickups</h5>
						</div>
						<div class="card-body p-0">
							<table class="table table-hover align-middle mb-0">
								<thead class="table-light">
									<tr>
										<th>Order ID</th>
										<th>Customer</th>
										<th>Product</th>
										<th>Reason</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="ret : ${myReturns}">
										<td th:text="'#' + ${ret.id}"></td>
										<td>
											<span th:text="${ret.user.firstName}"></span><br>
											<small th:text="${ret.user.phoneNo}"></small>
										</td>
										<td th:text="${ret.product.name}"></td>
										<td class="text-danger fw-bold" th:text="${ret.returnReason}"></td>
										<td>
											<form action="/employee/completeReturn" method="post"
												onsubmit="return confirm('Confirm item collected and cash refunded?');">
												<input type="hidden" name="orderId" th:value="${ret.id}">
												<button type="submit" class="btn btn-success btn-sm">
													<i class="bi bi-check-circle"></i> Complete Return
												</button>
											</form>
										</td>
									</tr>
									<tr th:if="${myReturns.empty}">
										<td colspan="5" class="text-center">No return pickups assigned.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
