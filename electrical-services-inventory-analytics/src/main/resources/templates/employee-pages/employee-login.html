<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Login | Mathapati Electricals</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		/* Navbar styling */
		.navbar {
			background: linear-gradient(90deg, #022860, #3f97db);
			padding-top: 4px;
			padding-bottom: 4px;
		}

		.navbar-brand {
			font-weight: bold;
			color: #fff !important;
		}

		.navbar-nav .nav-link {
			color: #fff !important;
			font-size: 1.1rem;
			transition: all 0.3s ease;
		}

		.navbar-nav .nav-link:hover {
			color: #000 !important;
			background-color: #fff;
			border-radius: 6px;
			transform: translateY(-2px);
		}

		/* Hero Section */
		.hero {
			background: linear-gradient(to right, #3f97db, #022860);
			color: white;
			padding: 100px 0;
			text-align: center;
		}

		.hero h1 {
			font-size: 2.5rem;
			font-weight: bold;
		}

		.hero p {
			font-size: 1.2rem;
			margin-top: 10px;
		}

		/* Footer */
		footer {
			background-color: #022860;
			color: #fff;

		}

		footer small {
			color: #ddd;
		}


		/* Common Styling */
		body {

			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #f0f9f2;


		}

		/* Navbar */
		.logo {
			height: 40px;
		}

		/* Login Form Styling */
		.login-container {

			background: linear-gradient(90deg, #f1dc9c, #a3a78e);
			width: 400px;
			margin: 80px auto;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
		}

		.login-container h3 {
			text-align: center;
			margin-bottom: 20px;
			color: #333;
		}

		.btn {
			border-radius: 89px;

		}

		a {
			color: #0d6efd;
		}

		.navbar-nav ms-auto {
			gap: 60px;

		}
	</style>
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="/">
				<img th:src="@{/images/tiger.jpg}" alt="Logo" width="45" height="45"
					class="rounded-circle me-2 border border-light">
				Mathapati Electricals
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">

					<li class="nav-item mx-2"><a class="nav-link" href="#aboutus">About Us</a></li>
					<li class="nav-item mx-2"><a class="nav-link" href="#contactus">Contact us</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="login-container">
		<h3 class="text-center mb-4">Employee Login</h3>

		<div th:if="${errorMSG}" class="alert alert-danger" role="alert">
			<span th:text="${errorMSG}"></span>
		</div>

		<form th:action="@{/employee-login}" method="post">
			<div class="mb-3">
				<label class="form-label">Email ID</label>
				<input type="email" class="form-control" name="email" placeholder="Enter Email ID"
					pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
					title="Please enter a valid email address (e.g., employee@company.com)" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Password</label>
				<input type="password" class="form-control" name="password" placeholder="Enter Password" required>
			</div>

			<button type="submit" class="btn btn-primary w-100">Login</button>
		</form>

		<div class="text-center mt-3">
			New Employee?
			<a th:href="@{/employee-register}" class="text-decoration-none">Apply Here</a>
		</div>
	</div>
	<!--footer fragment starts-->
	<div th:replace="~{fragments/footer-page :: fullFooter}"></div>
	<!--Footer fragment ends--> <!-- Bootstrap JS (CDN) -->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
