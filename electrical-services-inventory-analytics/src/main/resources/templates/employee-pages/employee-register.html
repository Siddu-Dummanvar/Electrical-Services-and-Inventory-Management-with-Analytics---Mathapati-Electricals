<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Registration | Mathapati Electricals</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

	<style>
		body {
			font-family: 'Segoe UI', sans-serif;
			background-color: #f0f9f2;
		}

		.navbar {
			background: linear-gradient(90deg, #022860, #3f97db);
			padding: 4px 0;
		}

		.navbar-brand {
			font-weight: bold;
			color: #fff !important;
		}

		.registration-container {
			max-width: 700px;
			margin: 50px auto;
			background: linear-gradient(90deg, #f1dc9c, #a3a78e);
			padding: 30px;
			border-radius: 15px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
		}

		.error-message {
			color: #D8000C;
			font-size: 0.9em;
			font-weight: bold;
			display: block;
			margin-top: 5px;
		}
	</style>
</head>

<body>

	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="/">
				<img th:src="@{/images/tiger.jpg}" alt="Logo" width="45" height="45"
					class="rounded-circle me-2 border border-light">
				Mathapati Electricals - Employee Portal
			</a>
		</div>
	</nav>

	<div><a class="btn btn-outline-primary w-10 ms-3 mt-3" th:href="@{/}">Go Back</a></div>

	<div class="container">
		<div class="registration-container">

			<div th:if="${successMSG}" class="alert alert-success text-center" role="alert">
				<i class="bi bi-check-circle-fill"></i> <span th:text="${successMSG}"></span>
			</div>

			<div th:if="${errorMSG}" class="alert alert-danger text-center" role="alert">
				<i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMSG}"></span>
			</div>

			<h2 class="text-center mb-3">Employee Registration</h2>
			<p class="text-center text-muted mb-4">Join our team as an Electrician or Staff</p>

			<form th:action="@{/employee-register}" method="post" th:object="${employee}">

				<h5 class="text-primary mb-3"><i class="bi bi-briefcase-fill"></i> Job Details</h5>
				<div class="row mb-3">
					<div class="col-md-4">
						<label class="form-label">Applying For</label>
						<select class="form-select" th:field="*{jobTitle}" required>
							<option value="" selected>-- Select Role --</option>
							<option value="Electrician">Electrician</option>
							<option value="Helper">Helper</option>
							<option value="Supervisor">Supervisor</option>
							<option value="Delivery Boy">Delivery Boy</option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Experience</label>
						<input type="text" class="form-control" th:field="*{experience}" placeholder="e.g. 2 Years"
							required>
					</div>
					<div class="col-md-4">
						<label class="form-label">Age (18-50)</label>
						<input type="number" class="form-control" th:field="*{age}" min="18" max="50" required
							title="Age must be between 18 and 50">
					</div>
				</div>
				<hr>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label">First Name</label>
						<input type="text" class="form-control" th:field="*{firstName}" required minlength="3">
					</div>
					<div class="col-md-6">
						<label class="form-label">Last Name</label>
						<input type="text" class="form-control" th:field="*{lastName}" required minlength="3">
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label">Email (This will be your Login ID)</label>
						<input type="email" class="form-control" th:field="*{email}" required>
					</div>
					<div class="col-md-6">
						<label class="form-label">Phone Number</label>
						<input type="text" class="form-control" th:field="*{phone}" required pattern="[0-9]{10}"
							maxlength="10">
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-12">
						<label class="form-label">Create Password</label>
						<div class="input-group">
							<input type="password" class="form-control" th:field="*{password}" id="passwordInput"
								required pattern="^(?=.*[A-Z])(?=.*[@#$%^&+=!]).{8,25}$"
								title="Must contain 1 Uppercase, 1 Special Char, and be 8+ chars.">
							<button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
								<i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
							</button>
						</div>
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-4">
						<label class="form-label">City</label>
						<input type="text" class="form-control" th:field="*{city}" required>
					</div>
					<div class="col-md-4">
						<label class="form-label">State</label>
						<input type="text" class="form-control" th:field="*{state}" required>
					</div>
					<div class="col-md-4">
						<label class="form-label">PIN</label>
						<input type="text" class="form-control" th:field="*{pin}" required pattern="[0-9]{6}"
							maxlength="6">
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label">Full Address</label>
					<textarea class="form-control" th:field="*{address}" rows="2"></textarea>
				</div>

				<div class="d-grid">
					<button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
				</div>
				<div class="text-center mt-3">
					<a th:href="@{/employee-login}" class="text-decoration-none">Already an employee? Login here</a>
				</div>

			</form>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Password Toggle Script
		document.getElementById('togglePasswordBtn').addEventListener('click', function () {
			const passwordInput = document.getElementById('passwordInput');
			const icon = document.getElementById('togglePasswordIcon');
			const isPassword = passwordInput.getAttribute('type') === 'password';
			passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
			icon.className = isPassword ? 'bi bi-eye' : 'bi bi-eye-slash';
		});
	</script>
</body>

</html>
