<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Order Management | Admin</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/styles.css}">
	<style>
		.sidebar {
			height: 100vh;
			width: 250px;
			background-color: #071b38;
		}

		.navlink:hover {
			background-color: #072f4e;
		}

		.fontStyle {
			color: white;
			text-decoration: none;
			font-size: 1.1rem;
		}
		
		.sidebar {
		            height: 90vh;
		            width: 250px;
		            background-color: #071b38;
		            margin-top: 10px;
		        }
		        .fontStyle { color: #f6eeee; text-decoration: none; font-style: normal; font-size: large; }
		        .navlink { padding-top: 10px; padding-bottom: 15px; padding-left: 20px; }
		        .navlink:hover { background-color: #072f4e }
	</style>
</head>

<body>

	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<div class="container-fluid d-flex p-0">
		<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

		<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">
			<h2 class="mb-4 text-primary">Product Order Management</h2>

			<div class="table-responsive bg-white p-3 rounded shadow-sm">
				<table class="table table-hover align-middle">
					<thead class="table-dark">
						<tr>
							<th>Order ID</th>
							<th>Product</th>
							<th>Customer</th>
							<th>Price</th>
							<th>Payment</th>
							<th>Delivery Status</th>
							<th>Assign Delivery Boy</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="order : ${orders}">
							<td th:text="${order.id}">1</td>
							<td th:text="${order.product.name} + ' (x' + ${order.quantity} + ')'">Fan</td>
							<td>
								<span th:text="${order.user.firstName}">Name</span><br>
								<small th:text="${order.user.city}">City</small>
							</td>
							<td class="fw-bold text-success" th:text="'₹' + ${order.price}">100</td>
							<td>
								<span class="badge"
									th:classappend="${order.status == 'Paid' ? 'bg-success' : 'bg-warning text-dark'}"
									th:text="${order.status}">Pending</span>
								<br><small th:text="${order.paymentType}">COD</small>
							</td>
							<td>
								<span class="badge bg-info text-dark" th:text="${order.deliveryStatus}">Pending</span>
							</td>
							<td>
								<div th:if="${order.deliveryBoy == null}">
									<form th:action="@{/admin/orders/assign}" method="post" class="d-flex">
										<input type="hidden" name="orderId" th:value="${order.id}">
										<select name="employeeEmail" class="form-select form-select-sm me-2" required>
											<option value="">Select Delivery Boy</option>
											<option th:each="emp : ${employees}"
												th:if="${emp.jobTitle == 'Delivery Boy' and emp.workStatus == 'FREE'}"
												th:value="${emp.email}" th:text="${emp.firstName}"></option>
										</select>
										<button type="submit" class="btn btn-sm btn-primary">Assign</button>
									</form>
								</div>
								<div th:if="${order.deliveryBoy != null}">
									<i class="bi bi-person-badge"></i> <span
										th:text="${order.deliveryBoy.firstName}">Name</span>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
