<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .order-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .table thead th { background-color: #343a40; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="order-container">
            <h2 class="text-center mb-4">My Order History</h2>
            
            <div th:if="${myorders.empty}" class="alert alert-info text-center">
                You have not placed any orders yet. <a th:href="@{/Home}">Start Shopping!</a>
            </div>

            <table th:if="${!myorders.empty}" class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Order Date</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Total Price</th>
                        <th>Payment Mode</th>
                        <th>Status</th>
                        <th>Transaction ID</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${myorders}">
                        <td th:text="${order.orderDate}"></td>
                        <td th:text="${order.product?.name}"></td>
                        <td th:text="${order.quantity}"></td>
                        <td th:text="'₹' + ${order.price}"></td>
                        <td th:text="${order.paymentType}"></td>
                        <td>
                            <span th:class="${order.status == 'Paid'} ? 'badge bg-success' : 'badge bg-warning'"
                                  th:text="${order.status}"></span>
                        </td>
                        <td th:text="${order.transactionId}"></td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center mt-4">
                <a th:href="@{/Home}" class="btn btn-primary">Continue Shopping</a>
            </div>
        </div>
    </div>
</body>
</html>
