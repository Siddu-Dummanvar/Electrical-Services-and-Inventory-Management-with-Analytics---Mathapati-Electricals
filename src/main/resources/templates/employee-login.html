<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>E S & Inventory Analytics | Welcome</title>

	<!-- Bootstrap CSS (CDN) -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		/* Navbar styling */
		.navbar {
			background: linear-gradient(90deg, #022860, #3f97db);
			padding-top: 4px;
			padding-bottom: 4px;
		}

		.navbar-brand {
			font-weight: bold;
			color: #fff !important;
		}

		.navbar-nav .nav-link {
			color: #fff !important;
			font-size: 1.1rem;
			transition: all 0.3s ease;
		}

		.navbar-nav .nav-link:hover {
			color: #000 !important;
			background-color: #fff;
			border-radius: 6px;
			transform: translateY(-2px);
		}

		/* Hero Section */
		.hero {
			background: linear-gradient(to right, #3f97db, #022860);
			color: white;
			padding: 100px 0;
			text-align: center;
		}

		.hero h1 {
			font-size: 2.5rem;
			font-weight: bold;
		}

		.hero p {
			font-size: 1.2rem;
			margin-top: 10px;
		}

		/* Footer */
		footer {
			background-color: #022860;
			color: #fff;

		}

		footer small {
			color: #ddd;
		}


		/* Common Styling */
		body {

			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #f0f9f2;


		}

		/* Navbar */
		.logo {
			height: 40px;
		}

		/* Login Form Styling */
		.login-container {

			background: linear-gradient(90deg, #f1dc9c, #a3a78e);
			width: 400px;
			margin: 80px auto;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
		}

		.login-container h3 {
			text-align: center;
			margin-bottom: 20px;
			color: #333;
		}

		.btn {
			border-radius: 89px;

		}

		a {
			color: #0d6efd;
		}

		.navbar-nav ms-auto {
			gap: 60px;

		}
	</style>
</head>

<body>
	<!-- NAVBAR -->
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="#">
				<img src="./images/tiger.jpg" alt="Logo" width="45" height="45"
					class="rounded-circle me-2 border border-light">
				Mathapati Electricals
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">

					<li class="nav-item mx-2"><a class="nav-link" href="#aboutus">About Us</a></li>
					<li class="nav-item mx-2"><a class="nav-link" href="#contactus">Contact us</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<!-- user login Form -->
	<div class="login-container">
		<h3>Employee Login</h3>
		<form id="employeeloginpage">
			<div class="mb-3">
				<label class="form-label">Employee Login</label>
				<input type="email" class="form-control" id="email" placeholder="Enter Employee ID" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Password</label>
				<input type="password" class="form-control" id="password" placeholder="Enter Password">
			</div>
			<button type="submit" class="btn btn-primary w-100">Login</button>
		</form>

		<div class="text-center mt-3">
			Don't have an account?
			<a href="/employee-register" class="text-decoration-none">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Register
				here</a>
		</div>

	</div>
	</div>

	<!-- user login Form -->

	<!--footer fragment starts-->
	<div th:replace="~{fragments/footer-page :: fullFooter}"></div>
	<!--Footer fragment ends-->
	
	
	 <!-- Bootstrap JS (CDN) -->

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Get the form,
		const form = document.getElementById("employeeloginpage");

		form.addEventListener("submit", function (event) {
			event.preventDefault(); // Prevent form from reloading the page

			// Get input values
			const email = document.getElementById("email").value;
			const password = document.getElementById("password").value;

			// Simple login check (you can replace this with database check)
			if (email === "emp@gmail.com" && password === "emp123") {
				alert("Login successful!");
				window.location.href = "/Home";  //  Redirect to home page
			} else {
				alert("Invalid email or password!");
			}
		});
	</script>
</body>

</html>
