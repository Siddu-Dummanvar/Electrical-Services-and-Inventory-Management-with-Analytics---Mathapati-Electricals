<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | E S & Inventory Analytics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* (Your existing CSS is great, no changes needed) */
    .navbar {
      background: linear-gradient(90deg, #022860, #3f97db);
      padding-top: 4px;
      padding-bottom: 4px;
    }
    .navbar-brand { font-weight: bold; color: #fff !important; }
    .navbar-nav .nav-link { color: #fff !important; font-size: 1.1rem; transition: all 0.3s ease; }
    .navbar-nav .nav-link:hover { color: #000 !important; background-color: #fff; border-radius: 6px; transform: translateY(-2px); }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f9f2; }
    .login-container { background: linear-gradient(90deg, #f1dc9c, #a3a78e); width: 400px; margin: 80px auto; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); }
    .login-container h3 { text-align: center; margin-bottom: 20px; color: #333; }
    .btn { border-radius: 89px; }
    a { color: #0d6efd; }
    footer { background-color: #022860; color: #fff; }
    footer small { color: #ddd; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">
        <img th:src="@{/images/tiger.jpg}" alt="Logo" width="45" height="45" class="rounded-circle me-2 border border-light">
        Mathapati Electricals
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    
    </div>
  </nav>

  <div class="login-container">
    <h3>Admin Login</h3>
    
    <div th:if="${errorMSG}" class="alert alert-danger d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <div>
        <strong th:text="${errorMSG}"></strong>
      </div>
    </div>
    
    <form th:action="@{/admin/login}" th:object="${adminUser}" method="POST">
      <div class="mb-3">
        <label for="adminId" class="form-label">Admin ID (Email)</label>
        <input type="email" class="form-control" id="adminId" th:field="*{emailid}" placeholder="Enter Admin Email" required>
      </div>
      <div class="mb-3">
        <label for="adminPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="adminPassword" th:field="*{password}" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
