<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .success-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        .icon-circle { width: 80px; height: 80px; background-color: #d1e7dd; color: #198754; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2 class="fw-bold text-success">Payment Successful!</h2>
        <p class="text-muted">Your order has been placed successfully.</p>
        
        <div class="alert alert-light border my-4">
            <strong>Order ID:</strong> <span th:text="${order.id}">#1234</span><br>
            <strong>Transaction ID:</strong> <span th:text="${order.transactionId}">TXN...</span>
        </div>

        <p class="mb-4">Please download your invoice to proceed.</p>

        <div class="d-grid gap-2">
            <a th:href="@{/order/invoice/{id}(id=${order.id})}" class="btn btn-danger btn-lg shadow-sm">
                <i class="bi bi-file-earmark-pdf-fill"></i> Download Invoice
            </a>
            
            <a th:href="@{/Home}" class="btn btn-outline-secondary mt-2">
                Back to Home
            </a>
        </div>
    </div>

</body>
</html>
