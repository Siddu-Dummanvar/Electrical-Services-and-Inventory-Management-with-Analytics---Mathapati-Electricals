<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

    <div class="sidebar" th:fragment="employeeSidebar" style="background-color: #071b38; min-height: 100vh; padding-top: 20px;">
        
        <div class="text-center mb-4">
            <div class="text-white">
                <div class="bg-white text-primary rounded-circle d-inline-flex justify-content-center align-items-center mb-2" style="width: 60px; height: 60px;">
                    <i class="bi bi-person-fill fs-2"></i>
                </div>
                <br>
                <span class="fs-5 fw-bold" th:text="${employee.firstName}">Name</span>
                <br>
                <span class="badge bg-warning text-dark mt-1" th:text="${employee.jobTitle}">Role</span>
            </div>
        </div>

        <hr style="border-color: rgba(255,255,255,0.2); margin: 10px 20px;">

        <div class="navlink" style="padding: 10px 20px;">
            <a th:href="@{/employee/dashboard}" class="text-white text-decoration-none fs-5">
                <i class="bi bi-speedometer2"></i>&nbsp;&nbsp;Dashboard
            </a>
        </div>

        <div class="navlink" style="padding: 10px 20px;">
            <a th:href="@{/employee/logout}" class="text-white text-decoration-none fs-5">
                <i class="bi bi-box-arrow-right"></i>&nbsp;&nbsp;Logout
            </a>
        </div>

    </div>

</body>
</html>
