<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Dashboard | E S & Inventory Analytics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/styles.css}">
	<link rel="stylesheet" th:href="@{/css/products.css}">

	<style>
		.navbar {
			padding-top: 0px;
			padding-bottom: 0px;
			background: linear-gradient(90deg, #022860, #3f97db);
			margin-bottom: 1px;
		}

		.navbar-brand img {
			border: 2px solid white;
		}

		.sidebar {
			height: 90vh;
			/* Changed to viewport height */
			width: 250px;
			background-color: #071b38;
			margin-top: 10px;
		}

		.fontStyle {
			color: #f6eeee;
			text-decoration: none;
			font-style: normal;
			font-size: large;
		}

		.navlink {
			padding-top: 10px;
			padding-bottom: 15px;
			padding-left: 20px;
		}

		.navlink:hover {
			background-color: #072f4e
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>


	<section>
		<div class="container-fluid d-flex p-0">

			<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>


			<div class="flex-grow-1 p-4" style="background-color: #f5f5f5;">

				<div class="container">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h2>Product Management</h2>
					</div>

					<div th:if="${products.isEmpty()}" class="alert alert-info text-center" role="alert">
						There are no products in the database yet.
					</div>

					<div class="table-responsive" th:if="${!products.isEmpty()}">
						<table class="table table-striped table-hover align-middle">
							<thead class="table-dark">
								<tr>
									<th>Si No (ID)</th>
									<th>Product Name</th>
									<th>Category</th>
									<th>Price</th>
									<th>Stock</th>
									<th>Uploaded Time</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="product : ${products}">
									<td th:text="${product.id}">1</td>
									<td th:text="${product.name}">Ceiling Fan</td>
									<td th:text="${product.category != null ? product.category.name : 'N/A'}">Fan</td>
									<td th:text="'₹' + ${#numbers.formatDecimal(product.sellingPrice, 1, 2)}">₹1500.00
									</td>
									<td>
										<span th:text="${product.stock}"
											th:classappend="${product.stock == 0 ? 'text-danger fw-bold' : ''}">
											50
										</span>
									</td>
									<td th:text="${#temporals.format(product.createdDate, 'dd-MMM-yyyy hh:mm a')}">
										10-Nov-2025</td>
									<td>
										<a href="#" class="btn btn-sm btn-outline-danger">
											<i class="bi bi-trash-fill"></i> Delete
										</a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>

			</div>
		</div>
	</section>

	<footer class="text-center py-4 bg-light mt-auto">
		<small>&copy; 2025 E S & Inventory Analytics</small>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
